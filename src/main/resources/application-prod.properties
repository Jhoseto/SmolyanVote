# Production HTTPS session cookies (activated with spring.profiles.active=prod)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=__Secure-JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Email / OAuth links must point at the public Next.js origin in production
smolyanvote.frontend.url=${SMOLYANVOTE_FRONTEND_URL:https://smolyanvote.com}

# Граждански монитор — scraper sidecar in Docker network
monitor.scraper.url=${MONITOR_SCRAPER_URL:http://scraper:3099}
monitor.scraper.max-documents-per-section=${MONITOR_SCRAPER_MAX_DOCS:40}

# Scheduled ingestion (cron timezone set on @Scheduled methods — Europe/Sofia)
monitor.ingestion.scheduler-enabled=${MONITOR_INGESTION_SCHEDULER_ENABLED:true}
monitor.ingestion.sigma-enabled=${MONITOR_INGESTION_SIGMA_ENABLED:true}
monitor.ingestion.eop-enabled=${MONITOR_INGESTION_EOP_ENABLED:true}
monitor.ingestion.scrape-enabled=${MONITOR_INGESTION_SCRAPE_ENABLED:true}
monitor.ingestion.ai-batch-enabled=${MONITOR_INGESTION_AI_BATCH_ENABLED:true}
monitor.ingestion.eop-days=${MONITOR_INGESTION_EOP_DAYS:7}
monitor.ingestion.ai-batch-limit=${MONITOR_INGESTION_AI_BATCH_LIMIT:5}
monitor.ingestion.trade-register-batch-limit=${MONITOR_INGESTION_TRADE_REGISTER_BATCH_LIMIT:10}
monitor.ingestion.trade-register-delay-ms=${MONITOR_INGESTION_TRADE_REGISTER_DELAY_MS:2000}

# Plain logs in production (Railway/Docker log collectors)
spring.output.ansi.enabled=never
spring.jackson.time-zone=Europe/Sofia
