<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нов подкаст епизод - SmolyanVote.com</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; color: #333;">
<div style="max-width: 600px; margin: 40px auto; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 30px;">
  <h1 style="color: #2c3e50; font-size: 24px; margin-bottom: 20px;">Нов епизод: {{episodeTitle}}</h1>
  <p style="font-size: 16px; line-height: 1.5;">
    Здравейте{{usernameSuffix}},
  </p>
  <p style="font-size: 16px; line-height: 1.5;">
    Публикуван е нов епизод от SmolyanVote подкаста.
  </p>
  <p style="font-size: 15px; line-height: 1.5; color: #555;">{{episodeDescription}}</p>
  <a href="{{episodeLink}}" target="_blank" rel="noopener noreferrer"
     style="display: inline-block; margin-top: 24px; padding: 12px 25px; font-size: 16px; color: #f3f3f3; background-color: #47b77c; text-decoration: none; border-radius: 5px; font-weight: bold;">
    Слушай епизода
  </a>
  <div style="margin-top: 40px; font-size: 12px; color: #999; text-align: center;">
    &copy; 2025 SmolyanVote.bg
  </div>
</div>
</body>
</html>
